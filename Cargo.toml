[package]
name = "taill"
version = "0.2.0"
edition = "2021"
description = "A TUI log viewer with search, filtering, and real-time file monitoring"
license = "MIT"
authors = ["Zhishan Zhang <zhangzhishanlo@gmail.com>"]
repository = "https://github.com/zhangzhishanlo/taill"
keywords = ["tail", "watch", "file", "monitor", "cli"]
categories = ["command-line-utilities", "filesystem"]

[dependencies]
notify = "8.0.0"
glob = "0.3.1"
clap = "4.5.3"
ratatui = "0.29"
crossterm = "0.28"
regex = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
dirs = "5"
arboard = "3"

[dev-dependencies]
tempfile = "3.8.0"
